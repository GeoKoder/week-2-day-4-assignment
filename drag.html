<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag-and-Drop</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <!-- Theme Toggle Button -->
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Switch to dark theme"
      aria-pressed="false"
    >
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle-text">Dark Mode</span>
    </button>

    <div class="container">
      <h1>The Re-Order List</h1>
      <p>Here's my list of tasks. Help me reorder with a simple drag and drop</p>

      <ol id="draggable-list">
        <li class="list-item" draggable="true">Review and Refactor Code</li>
        <li class="list-item" draggable="true">Update Documentation</li>
        <li class="list-item" draggable="true">Test Your Changes</li>
        <li class="list-item" draggable="true">Sync with Version Control</li>
        <li class="list-item" draggable="true">Plan and Prioritize Tasks</li>
      </ol>
    </div>

    <script src="drag.js"></script>
  </body>
</html>
