<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mctaba trip Registration</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Mctaba Trip Registration Form</h1>
    <p>Kindly register with us.</p>

    <form id="signup-form" action="#" method="POST">
      <!-- Name Field  -->
      <div>
        <label for="name">Full Name:</label><br />
        <input type="text" name="name" id="name" placeholder="James Kariuki" />
        <div id="name-error" class="name-error"></div>
      </div>
      <br />

      <!-- Email Field  -->
      <div>
        <label for="email">Email Address:</label><br />
        <input
          type="email"
          name="email"
          id="email"
          placeholder="jameskariuki2@example.com"
        />
        <div id="email-error" class="email-error"></div>
      </div>
      <br />

      <!-- Phone Field  -->
      <div>
        <label for="phone">Phone Number:</label><br />
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="0712345678 or 0112345678"
        />
        <div id="phoneError" style="color: red; min-height: 18px"></div>
      </div>
      <br />

      <!-- Password Field  -->
      <div>
        <label for="password">Password:</label><br />
        <input
          type="password"
          name="password"
          id="password"
          placeholder="••••••••"
        />
        <div id="password-error" class="password-error"></div>
      </div>
      <br />

      <button type="submit">Submit</button>

      <p id="success-message" class="success-message"></p>
    </form>

    <script src="form.js"></script>
  </body>
</html>
